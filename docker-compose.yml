version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: llm_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmpass}
      POSTGRES_DB: ${POSTGRES_DB:-llmdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - llm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmuser} -d ${POSTGRES_DB:-llmdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Admin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: llm_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    networks:
      - llm_network
    depends_on:
      - postgres
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-llmuser}:${POSTGRES_PASSWORD:-llmpass}@postgres:5432/${POSTGRES_DB:-llmdb}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    networks:
      - llm_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm_frontend
    networks:
      - llm_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: llm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - llm_network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: llm_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - llm_network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:

networks:
  llm_network:
    driver: bridge
